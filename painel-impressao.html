<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Impressão - Delivery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      color: #333;
      font-size: 24px;
    }

    .status {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 14px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4CAF50;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .pedidos-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .pedido-card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-left: 5px solid #667eea;
      animation: slideIn 0.3s ease-out;
    }

    .pedido-card.novo {
      border-left-color: #FF9800;
      background: #FFF8F0;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .pedido-id {
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }

    .pedido-hora {
      font-size: 12px;
      color: #999;
      margin-bottom: 15px;
    }

    .pedido-cliente {
      margin: 10px 0;
      font-size: 14px;
    }

    .pedido-cliente strong {
      display: block;
      color: #667eea;
    }

    .pedido-endereco {
      font-size: 12px;
      color: #666;
      margin: 10px 0;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 4px;
    }

    .pedido-itens {
      margin: 15px 0;
      border-top: 1px solid #eee;
      padding-top: 10px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 12px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
      color: #666;
    }

    .pedido-total {
      font-size: 16px;
      font-weight: bold;
      color: #667eea;
      margin: 15px 0;
      padding-top: 10px;
      border-top: 2px solid #667eea;
    }

    .pedido-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      flex: 1;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn-imprimir {
      background: #4CAF50;
      color: white;
    }

    .btn-imprimir:hover {
      background: #45a049;
      transform: scale(1.02);
    }

    .btn-entregue {
      background: #2196F3;
      color: white;
    }

    .btn-entregue:hover {
      background: #0b7dda;
      transform: scale(1.02);
    }

    .vazio {
      background: white;
      padding: 40px;
      border-radius: 8px;
      text-align: center;
      color: #999;
    }

    .vazio p {
      font-size: 16px;
    }

    @media (max-width: 768px) {
      .pedidos-container {
        grid-template-columns: 1fr;
      }

      .header {
        flex-direction: column;
        gap: 15px;
      }
    }

    @media print {
      body {
        background: white;
      }
      .container {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🍕 Painel de Impressão</h1>
      <div class="status">
        <div class="status-dot"></div>
        <span id="statusText">Conectado</span>
      </div>
    </div>

    <div id="pedidosContainer" class="pedidos-container">
      <div class="vazio">
        <p>⏳ Carregando pedidos...</p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://padocadodede.com';
    let ultimoPedidoImpresso = null;
    let autoimpressaoAtiva = true;

    function getTenant() {
      const tenant = localStorage.getItem('selectedTenant');
      return tenant || 'padoca';
    }

    async function fetchTenant(endpoint, options = {}) {
      const tenant = getTenant();
      return fetch(`${API_URL}${endpoint}`, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'X-Tenant': tenant,
          ...options.headers
        }
      });
    }

    async function buscarPedidos() {
      try {
        const response = await fetchTenant('/api/pedidos');
        const data = await response.json();
        return Array.isArray(data) ? data : data.pedidos || [];
      } catch (error) {
        console.error('Erro ao buscar pedidos:', error);
        document.getElementById('statusText').textContent = 'Erro na conexão';
        return [];
      }
    }

    function gerarHTMLImpressao(pedido) {
      const dataFormatada = new Date(pedido.data).toLocaleString('pt-BR');
      const itensHTML = pedido.itens.map(item => `
        <tr>
          <td style="text-align:center;padding:5px;border:1px solid #ccc;">${item.quantidade}</td>
          <td style="padding:5px;border:1px solid #ccc;">${item.nome}</td>
          <td style="text-align:right;padding:5px;border:1px solid #ccc;">R$ ${(item.preco * item.quantidade).toFixed(2)}</td>
        </tr>
      `).join('');

      return `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: 'Courier New', monospace; padding: 12px; font-size: 12px; }
    .header { text-align: center; margin-bottom: 10px; }
    .pedido-id { font-size: 16px; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; }
    th { border-bottom: 2px solid #000; padding: 5px; text-align: left; }
    td { border: 1px solid #ccc; padding: 5px; }
    .total-row { background: #f0f0f0; font-weight: bold; }
    .footer { text-align: center; margin-top: 10px; font-size: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="pedido-id">NOVO PEDIDO</div>
    <div class="pedido-id">#${pedido.id}</div>
    <small>${dataFormatada}</small>
  </div>
  <div style="margin: 10px 0;">
    <div><strong>Cliente:</strong> ${pedido.cliente.nome}</div>
    <div><strong>Telefone:</strong> ${pedido.cliente.whatsapp}</div>
  </div>
  <div style="margin: 10px 0;">
    <div><strong>Endereco:</strong> ${pedido.endereco}, ${pedido.bairro}</div>
  </div>
  <table style="margin: 10px 0;">
    <thead>
      <tr><th style="width:15%">Qtd</th><th style="width:60%">Descricao</th><th style="width:25%">Valor</th></tr>
    </thead>
    <tbody>
      ${itensHTML}
      <tr class="total-row">
        <td colspan="2" style="text-align:right">TOTAL:</td>
        <td style="text-align:right">R$ ${pedido.total.toFixed(2)}</td>
      </tr>
    </tbody>
  </table>
  <div class="footer">Impresso em ${new Date().toLocaleTimeString('pt-BR')}</div>
</body>
</html>`;
    }

    function abrirImpressao(pedido) {
      const html = gerarHTMLImpressao(pedido);
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const janela = window.open(url, '_blank', 'width=800,height=600');
      
      setTimeout(() => {
        if (janela) {
          janela.print();
        }
      }, 1000);
    }

    async function marcarEntregue(pedidoId) {
      try {
        await fetchTenant(`/api/pedidos/${pedidoId}`, {
          method: 'PUT',
          body: JSON.stringify({ status: 'entregue' })
        });
        sincronizar();
      } catch (error) {
        console.error('Erro ao atualizar pedido:', error);
        alert('Erro ao atualizar pedido');
      }
    }

    function renderizarPedidos() {
      const container = document.getElementById('pedidosContainer');
      const pedidos = JSON.parse(localStorage.getItem('pedidosPainel') || '[]');

      if (pedidos.length === 0) {
        container.innerHTML = `<div class="vazio"><p>✅ Sem pedidos pendentes</p></div>`;
        return;
      }

      container.innerHTML = pedidos.map(pedido => `
        <div class="pedido-card ${!ultimoPedidoImpresso || pedido.id > ultimoPedidoImpresso ? 'novo' : ''}">
          <div class="pedido-id">Pedido #${pedido.id}</div>
          <div class="pedido-hora">${new Date(pedido.data).toLocaleTimeString('pt-BR')}</div>
          
          <div class="pedido-cliente">
            <strong>${pedido.cliente.nome}</strong>
            ${pedido.cliente.whatsapp}
          </div>
          
          <div class="pedido-endereco">
            ${pedido.endereco}, ${pedido.bairro}
            ${pedido.referencia ? `<br>📍 ${pedido.referencia}` : ''}
          </div>
          
          <div class="pedido-itens">
            ${pedido.itens.map(item => `
              <div class="item">
                <span>${item.quantidade}x ${item.nome}</span>
                <span>R$ ${(item.preco * item.quantidade).toFixed(2)}</span>
              </div>
            `).join('')}
          </div>
          
          <div class="pedido-total">TOTAL: R$ ${pedido.total.toFixed(2)}</div>
          
          <div class="pedido-actions">
            <button class="btn btn-imprimir" onclick="abrirImpressao(${JSON.stringify(pedido).replace(/"/g, '&quot;')})">
              🖨️ Imprimir
            </button>
            <button class="btn btn-entregue" onclick="marcarEntregue('${pedido.id}')">
              ✓ Entregue
            </button>
          </div>
        </div>
      `).join('');
    }

    async function sincronizar() {
      const pedidos = await buscarPedidos();
      const pendentes = pedidos.filter(p => p.status === 'pendente');

      if (pendentes.length > 0 && autoimpressaoAtiva) {
        const ultimoPedido = pendentes[pendentes.length - 1];
        
        if (!ultimoPedidoImpresso || ultimoPedido.id > ultimoPedidoImpresso) {
          console.log('🔔 Novo pedido detectado:', ultimoPedido.id);
          ultimoPedidoImpresso = ultimoPedido.id;
          
          try {
            const audio = new Audio('/assets/u_7xr5ffk4oq-opening-bell-421471.mp3');
            audio.play().catch(() => {});
          } catch {}
          
          setTimeout(() => {
            abrirImpressao(ultimoPedido);
          }, 500);
        }
      }

      localStorage.setItem('pedidosPainel', JSON.stringify(pendentes));
      renderizarPedidos();
      document.getElementById('statusText').textContent = `Conectado - ${pendentes.length} pedido(s)`;
    }

    setInterval(sincronizar, 5000);
    sincronizar();
  </script>
</body>
</html>

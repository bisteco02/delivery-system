<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Super Admin - PadocaOnline</title>
    <link href="./styles/output.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-purple-600 to-purple-900 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">👑 Super Admin</h1>
            <p class="text-gray-600">Painel de Gerenciamento</p>
        </div>
        
        <form id="formLogin" class="space-y-4">
            <div>
                <label class="block text-sm font-bold mb-2 text-gray-700">Usuário</label>
                <input type="text" id="usuario" required 
                    class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent"
                    placeholder="superadmin">
            </div>
            
            <div>
                <label class="block text-sm font-bold mb-2 text-gray-700">Senha</label>
                <input type="password" id="senha" required 
                    class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent"
                    placeholder="••••••••">
            </div>
            
            <button type="submit" 
                class="w-full bg-purple-600 text-white py-3 rounded-lg font-bold hover:bg-purple-700 transition">
                🔐 Entrar
            </button>
        </form>
        
        <div id="mensagem" class="mt-4 p-3 rounded-lg hidden"></div>
        
        <div class="mt-6 text-center">
            <a href="/landing.html" class="text-purple-600 hover:underline text-sm">
                ← Voltar para a página inicial
            </a>
        </div>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const dados = {
                usuario: document.getElementById('usuario').value,
                senha: document.getElementById('senha').value
            };
            
            const mensagem = document.getElementById('mensagem');
            mensagem.classList.add('hidden');
            
            try {
                const response = await fetch('http://localhost:3001/api/super-admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                
                const resultado = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('superAdminToken', resultado.token);
                    mensagem.className = 'mt-4 p-3 rounded-lg bg-green-100 text-green-800';
                    mensagem.textContent = '✅ Login realizado com sucesso!';
                    mensagem.classList.remove('hidden');
                    
                    setTimeout(() => {
                        window.location.href = '/super-admin.html';
                    }, 1000);
                } else {
                    throw new Error(resultado.erro || 'Erro no login');
                }
            } catch (error) {
                mensagem.className = 'mt-4 p-3 rounded-lg bg-red-100 text-red-800';
                mensagem.textContent = '❌ ' + error.message;
                mensagem.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
